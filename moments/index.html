        <span class="countdown-title">Calculating...</span>
    </div>

    <div class="memorial-counter">
        <div class="counter-number">-</div>

            <span class="date-info">Calculating...</span>

<script>
(function() {
    const widget = document.currentScript ? document.currentScript.previousElementSibling : null;
    const widgetId = widget ? widget.id : '';
    const date = widget ? widget.dataset.date || '' : '';
    const useViewDate = widget ? widget.dataset.useViewDate === 'true' : false;
    const rangeStart = widget ? widget.dataset.rangeStart || '' : '';
    const rangeEnd = widget ? widget.dataset.rangeEnd || '' : '';
    const title = widget ? widget.dataset.title || '目标日期' : '目标日期';
    const pubDate = widget ? widget.dataset.pubDate || '' : '';

    
    
    
    
    
    
    
    
    

    function parseFixedDate(dateStr) {
        if (!dateStr) {
            return null;
        }

        const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr);
        if (!match) {
            return null;
        }

        const year = Number(match[1]);
        const month = Number(match[2]);
        const day = Number(match[3]);
        const parsed = new Date(year, month - 1, day);

        if (
            parsed.getFullYear() !== year ||
            parsed.getMonth() !== month - 1 ||
            parsed.getDate() !== day
        ) {
            return null;
        }

        return parsed;
    }

    function getTodayDate() {
        const now = new Date();
        return new Date(now.getFullYear(), now.getMonth(), now.getDate());
    }

    function getDaysDifference(date1, date2) {
        const d1 = new Date(date1.getFullYear(), date1.getMonth(), date1.getDate());
        const d2 = new Date(date2.getFullYear(), date2.getMonth(), date2.getDate());
        const diffInMs = d2.getTime() - d1.getTime();
        return Math.floor(diffInMs / (1000 * 60 * 60 * 24));
    }

    function formatDateInfo(date, label) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');

        if (!label) {
            return `${year}-${month}-${day}`;
        }

        return `${label}(${year}-${month}-${day})`;
    }

    function adjustFontSize(element) {
        const container = element.parentElement;
        const containerWidth = container.clientWidth - 20;
        let fontSize = 120;

        element.style.fontSize = fontSize + 'px';

        while (element.scrollWidth > containerWidth && fontSize > 80) {
            fontSize -= 10;
            element.style.fontSize = fontSize + 'px';
        }

        while (element.scrollWidth < containerWidth && fontSize < 120) {
            const testSize = fontSize + 0.5;
            element.style.fontSize = testSize + 'px';

            if (element.scrollWidth > containerWidth) {
                element.style.fontSize = fontSize + 'px';
                break;
            }

            fontSize = testSize;
        }
    }

    function getConfig() {
        const hasDate = Boolean(date);
        const hasRangeStart = Boolean(rangeStart);
        const hasRangeEnd = Boolean(rangeEnd);
        const hasRange = hasRangeStart || hasRangeEnd;

        
        
        
        
        
        

        if (hasDate && hasRange) {
            
            return { error: 'date 和 rangeStart/rangeEnd 不能同时使用' };
        }

        if (!hasDate && !hasRange) {
            
            return { error: '必须填写 date，或同时填写 rangeStart 和 rangeEnd' };
        }

        if (hasRangeStart !== hasRangeEnd) {
            
            return { error: 'rangeStart 和 rangeEnd 必须同时填写' };
        }

        if (hasRange) {
            const startDateObj = parseFixedDate(rangeStart);
            const endDateObj = parseFixedDate(rangeEnd);

            
            
            
            
            
            

            if (!startDateObj || !endDateObj) {
                
                return { error: 'rangeStart 和 rangeEnd 只能使用 YYYY-MM-DD 格式' };
            }

            if (getDaysDifference(startDateObj, endDateObj) <= 0) {
                
                return { error: 'rangeStart 必须早于 rangeEnd' };
            }

            
            
            
            
            
            
            return {
                mode: 'range',
                useViewDate: false,
                startDateObj: startDateObj,
                endDateObj: endDateObj
            };
        }

        const targetDateObj = parseFixedDate(date);
        const baseDateObj = useViewDate ? getTodayDate() : parseFixedDate(pubDate);

        
        
        
        
        
        

        if (!targetDateObj) {
            
            return { error: 'date 只能使用 YYYY-MM-DD 格式' };
        }

        
        
        
        
        
        
        return {
            mode: 'date',
            useViewDate: useViewDate,
            startDateObj: baseDateObj,
            endDateObj: targetDateObj
        };
    }

    function updateDisplay() {
        
        
        
        
        if (!widget) return;

        const counterElement = widget.querySelector('.counter-number');
        const dateInfoElement = widget.querySelector('.date-info');
        const titleElement = widget.querySelector('.countdown-title');
        const headerElement = widget.querySelector('.memorial-header');
        const config = getConfig();

        

        if (config.error) {
            counterElement.textContent = '--';
            titleElement.textContent = '倒计时参数错误';
            dateInfoElement.textContent = config.error;
            headerElement.classList.add('past');
            adjustFontSize(counterElement);
            
            
            
            
            return;
        }

        const days = getDaysDifference(config.startDateObj, config.endDateObj);
        const isPast = days < 0;

        counterElement.textContent = Math.abs(days);
        titleElement.textContent = config.useViewDate
            ? `${title} 距今${isPast ? '已经' : '还有'}`
            : `${title} ${isPast ? '已经' : '还有'}`;
        headerElement.classList.toggle('past', isPast);

        const baseDateText = config.useViewDate
            ? formatDateInfo(config.startDateObj, '今天')
            : formatDateInfo(config.startDateObj);
        const targetDateText = formatDateInfo(config.endDateObj);

        dateInfoElement.textContent = isPast
            ? [targetDateText, baseDateText].join(' → ')
            : [baseDateText, targetDateText].join(' → ');

        adjustFontSize(counterElement);
        
        
        
        
        
        
        
        
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', updateDisplay);
    } else {
        updateDisplay();
    }
})();
</script>

<script>
    window.onscroll = function() {scrollFunction()};
    function scrollFunction() {

            $("#back-top-button").fadeIn();
        } else {
            $("#back-top-button").fadeOut();
        }
    }


    $( "#back-top-button" ).click(function() {
        $("html, body").animate({scrollTop: 0}, 500);
    });
</script>
